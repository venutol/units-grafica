name: 'UniTS Grafica coordinata statica'
type: theme
description: 'Grafica coordinata UniTS servita interamente in locale. Header e footer sono configurabili da interfaccia: impostazioni del tema per logo ed etichette, menu Drupal per i link.'
core_version_requirement: ^10.3 || ^11
base theme: bootstrap_barrio
logo: 'logo.svg'
favicon: 'favicon.ico'

'interface translation project': ut_gc
'interface translation server pattern': themes/custom/ut_gc/translations/%language.po

libraries:
  - ut_gc/bootstrap
  - ut_gc/font
  - ut_gc/global-styling

regions:
  top_header: 'Top header'
  top_header_form: 'Top header form'
  header: Header
  header_form: 'Header form'
  page_top: 'Page top'
  page_bottom: 'Page bottom'
  highlighted: Highlighted
  featured_top: 'Featured top'
  breadcrumb: Breadcrumb
  content: Content
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  featured_bottom_first: 'Featured bottom first'
  featured_bottom_second: 'Featured bottom second'
  featured_bottom_third: 'Featured bottom third'
  footer_first: 'Footer first'
  footer_second: 'Footer second'
  footer_third: 'Footer third'
  footer_fourth: 'Footer fourth'
