name: 'UniTS Grafica coordinata Lite'
type: theme
description: 'Variante essenziale della grafica coordinata: fascia blu con il logo e footer con logo e indirizzo. Il resto del footer è una regione libera per i blocchi del sito.'
core_version_requirement: ^10.3 || ^11
base theme: ut_gc
# Logo e favicon del tema base, per non duplicare l'SVG del logo (750 KB).
logo: '../ut_gc/logo.svg'

libraries:
  - ut_gc_lite/lite

regions:
  header: 'Header (a destra del logo)'
  highlighted: Highlighted
  breadcrumb: Breadcrumb
  content: Content
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  footer: 'Footer (a destra di logo e indirizzo)'
  page_top: 'Page top'
  page_bottom: 'Page bottom'
